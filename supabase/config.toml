project_id = "testy-shop"

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/api/auth/callback/fr/confirm", "http://localhost:3000/api/auth/callback/es/confirm", "http://localhost:3000/api/auth/callback/fr/recovery", "http://localhost:3000/api/auth/callback/es/recovery"]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
minimum_password_length = 8
